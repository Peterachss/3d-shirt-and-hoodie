name: Build Blender Scene

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-blend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout EL4CTEO/blender-skills for QA gate
        uses: actions/checkout@v4
        with:
          repository: EL4CTEO/blender-skills
          path: .blender-skills

      - name: Install Blender and Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version

      - name: Run Cloth Sim, PBR Shaders, Studio Lookdev & Export
        run: |
          blender --background --factory-startup --python-exit-code 1 --python build_garments_blender.py -- --render
          ls -lh shirt_and_hoodie.blend shirt_and_hoodie.glb blender_studio_render.png

      - name: Run blender-asset-qa checks and review sheet
        run: |
          blender --background --python-exit-code 1 shirt_and_hoodie.blend --python .blender-skills/skills/blender-asset-qa/scripts/qa_check.py -- --objects TShirt_Body TShirt_Collar TShirt_Hem --profile render
          blender --background --python-exit-code 1 shirt_and_hoodie.blend --python .blender-skills/skills/blender-asset-qa/scripts/qa_check.py -- --objects Hoodie_Body Hoodie_Waistband Hoodie_Cuff_L Hoodie_Cuff_R Hoodie_Hood Hoodie_KangarooPocket --profile render
          sed -i '/media_type/d' .blender-skills/skills/blender-asset-qa/scripts/review_shots.py
          blender --background --python-exit-code 1 shirt_and_hoodie.blend --python .blender-skills/skills/blender-asset-qa/scripts/review_shots.py -- --objects TShirt_Body TShirt_Collar TShirt_Hem Hoodie_Body Hoodie_Waistband Hoodie_Cuff_L Hoodie_Cuff_R Hoodie_Hood Hoodie_KangarooPocket --mode material --out qa_review.png

      - name: Remove temporary blender-skills checkout before commit
        run: rm -rf .blender-skills

      - name: Upload built 3D assets as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-shirt-and-hoodie
          path: |
            shirt_and_hoodie.blend
            blender_studio_render.png
            qa_review.png
            shirt_and_hoodie.glb
            tshirt.glb
            hoodie.glb
            shirt_and_hoodie.obj
            shirt_and_hoodie.mtl

      - name: Commit built .blend, .glb, .obj and renders back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shirt_and_hoodie.blend blender_studio_render.png qa_review.png tshirt.obj tshirt.mtl tshirt.glb hoodie.obj hoodie.mtl hoodie.glb shirt_and_hoodie.obj shirt_and_hoodie.mtl shirt_and_hoodie.glb
          if ! git diff --cached --quiet; then
            git commit -m "Build cloth-simulated shirt_and_hoodie.blend, GLBs, and Cycles render [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
